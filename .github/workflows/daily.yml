name: Daily curve monitor

# Runs every weekday at 22:00 UTC (after the US Treasury close) and commits
# that day's findings note back to the repo.
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          # Optional: add ANTHROPIC_API_KEY under Settings > Secrets to have
          # the market-color paragraph drafted by an LLM.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python monitor.py

      - name: Commit findings note
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sample_output/
          git diff --staged --quiet || git commit -m "Findings note $(date +%F)"
          git push
